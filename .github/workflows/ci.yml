name: CI

# 代码合并门禁：每次 push / PR 都运行下述检查
#   Job verify            —— 纯 Node 环境：typecheck → unit test → build（与 release.mjs 预检一致）
#   Job lint              —— 静态质量：oxlint（正确性规则）+ prettier 格式检查
#   Job coverage          —— 单元测试覆盖率门槛（锁定 Node 22，见下方说明）
#   Job integration-test  —— 真实 VS Code Extension Host：验证扩展能被宿主发现 + activate 成功
# 任一失败即阻断合并，保证发布产物可追溯、可复现。
#
# pnpm 安装策略（职责分离，避免冲突）：
#   actions/setup-node@v4  —— 只管 Node 版本，**不**配置任何 pnpm 参数
#   pnpm/action-setup@v4   —— 全权负责 pnpm 安装 + store 缓存
#   这样两者零重叠，不会触发 "Multiple versions of pnpm specified" 冲突
#
# 两个易踩的坑（2026-09-21 实测修正，此前 CI 自 09-19 起持续失败）：
#   1. v4 的 `cache` 入参是**布尔**。沿用 v2/v3 时代的 `cache: 'pnpm'` 字符串会让
#      action 内部的 getBooleanInput 抛 TypeError（"Input does not meet YAML 1.2
#      Core Schema specification: cache"），job 在 Setup pnpm 步骤即失败。
#   2. 省略 `version`：由 package.json 的 packageManager 字段单独决定 pnpm 版本，
#      避免「工作流与清单两处版本须手工同步」的漂移（release.yml 曾因此停留在 12.4.2）。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 层 1：静态 + 单元 + 构建 ──────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只管 Node 版本，不碰 pnpm
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # pnpm/action-setup 全权负责 pnpm 安装 + store 缓存。
      # 不传 version：以 package.json 的 packageManager（pnpm@12.5.1）为唯一事实源。
      # cache 为布尔（v4 语义），见文件头「两个易踩的坑」。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Install dependencies
        # frozen-lockfile：pnpm-lock.yaml 必须与 package.json 一致，否则 CI 失败，
        # 防止本地升级依赖但忘记提交 lockfile 而导致的漂移。
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # `node --test` 直跑 src/**/*.test.ts，依赖 Node 22.18+ 的类型擦除（见 engines.node）。
        run: pnpm test

      - name: Build
        run: pnpm build

  # ── 层 1.2：静态质量门禁（lint + 格式） ───────────────────────────────────
  # 为何独立成 job 而非并入 verify：lint 与格式检查极快（oxlint 全仓约 20ms），
  # 单列可与 verify 的 Node 矩阵并行，且失败时定位清晰、不浪费矩阵重跑。
  # 为何用 oxlint 而非 ESLint：typescript-eslint 8.x 明确拒绝 TS 7.0
  # （本项目 devDependencies 用 typescript@7 原生编译器），生态尚未跟上；
  # oxlint 不依赖 typescript 包，规则集与 ESLint 兼容，待其支持后可平滑回归。
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工作流自身的静态校验（actionlint）。
      # 为何必须：本类错误（上下文用错位置、键名拼错、表达式类型不符）**只在运行时才暴露**，
      # 且会**静默让整份工作流失效** —— 2026-09 的 `if: secrets.X != ''` 即让 release.yml
      # 失效数日（每次 push 都产生一个无 job 的失败运行）而无人察觉（见 MAINTENANCE_AUDIT §2.6）。
      # 用官方镜像并**钉死版本**，而非执行远端 `main` 分支的下载脚本 —— 避免供应链风险与版本漂移。
      - name: Lint workflow files (actionlint)
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # correctness 类规则为 error（阻断），suspicious/perf 为 warn（提示不阻断）
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  # ── 层 1.5：覆盖率门槛（锁定 Node 22） ────────────────────────────────────
  # 为何单独成 job 且锁 Node 22：Node 24 默认**不把测试文件计入**覆盖率，
  # 两版 "all files" 分母不同（同一文件逐行数值完全一致，如 dataService 95.96/80.30/69.57），
  # 跨版本共用阈值会被误杀。故门槛只在 Node 22 上执行。
  # 阈值随覆盖提升而抬升；低于阈值即失败 —— 工具强制优于人工遵守。
  coverage:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage gate (lines / branches / functions)
        run: pnpm test:coverage:gate

  # ── 层 2：真实 VS Code Extension Host 集成测试 ────────────────────────────
  # 验证扩展能被 VS Code 宿主发现 + activate 完整执行。
  # 两维矩阵：OS（Ubuntu/Windows/macOS）× VS Code 版本（最低支持/稳定线/insiders）
  #   - 最低支持 1.100.0   —— engines.vscode 的 floor，确保 ESM 入口真正能在 1.100 起工作
  #   - stable              —— 当前生产线，默认用户的实际运行环境
  #   - insiders            —— nightly 构建，提前发现 Microsoft 即将发布的变更回归
  # Linux 上 VS Code 是 Electron 应用，需要 xvfb-run 提供虚拟显示服务器。
  # 9 个 job 并行，任一失败即阻断合并。
  integration-test:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 版本号用精确字符串（1.100.0），stable/insiders 是 @vscode/test-electron 的别名
        vscode-version: ['1.100.0', 'stable', 'insiders']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只管 Node 版本
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm/action-setup 全权负责 pnpm 安装 + 缓存
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm compile

      # VS Code Electron 包缓存：key 带版本号，避免不同版本互相污染。
      # @vscode/test-electron 默认缓存到 process.cwd()/.vscode-test/（项目本地），
      # 也会回退到 ~/.vscode-test/。两边都缓存，最大化命中概率。
      - name: Cache VS Code Electron (${{ matrix.vscode-version }} on ${{ runner.os }})
        uses: actions/cache@v4
        with:
          path: |
            .vscode-test
            ~/.vscode-test
          key: vscode-${{ matrix.vscode-version }}-${{ runner.os }}

      - name: Install xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # 统一通过环境变量注入版本，runner 脚本读 VSCODE_TEST_VERSION。
      # 本地跑 pnpm test:integration 不传变量 → 默认 stable，行为不变。
      - name: Run integration tests (Linux, VS Code ${{ matrix.vscode-version }})
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a pnpm test:integration

      - name: Run integration tests (VS Code ${{ matrix.vscode-version }})
        if: runner.os != 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        run: pnpm test:integration
