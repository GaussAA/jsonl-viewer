# .github/workflows/release.yml
# Marketplace 自动发布流水线。
#
# 触发方式：
#   1. git tag v1.3.0 && git push origin v1.3.0     → 构建 + 发布到 Marketplace
#   2. GitHub Actions 页面 → Run workflow → 手动触发 → 构建 + 上传 VSIX 工件
#      （发布步骤以 `github.event_name == 'push'` 为闸，故手动触发不会发布；
#        如需手动也能发布，请先确认后改动那行 if 的条件。）
#
# 前置条件（一次性配置）：
#   a. 创建 Azure DevOps PAT（https://dev.azure.com → User Settings → Personal Access Tokens）
#      需要 Marketplace → Manage 权限
#   b. 在 GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret
#      名称 VSCE_PAT，值就是 PAT
#   c. 首次发布前本地跑一次 npx @vscode/vsce login 完成账户绑定（一次性）
#
# vsce 默认识别 VSCE_PAT 环境变量，不需要额外传参。
#
# pnpm 安装策略：setup-node 只管 Node，pnpm/action-setup 全权负责 pnpm + store 缓存。
# 版本不在此处写死 —— 由 package.json 的 packageManager 字段唯一决定。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # secrets 上下文**不能**出现在 if 条件里（GitHub 上下文可用性表：jobs.<job_id>.steps.if
    # 只允许 github/needs/strategy/matrix/job/runner/env/vars/steps/inputs）。原地写
    # `if: secrets.VSCE_PAT != ''` 会让整份工作流被判无效（Unrecognized named-value: 'secrets'），
    # 表现为**每次 push 都产生一个没有任何 job 的失败运行**。
    # 故按官方建议落地：secret 先映射到 job 级 env，if 判 env，run 内由 vsce 直接读该 env。
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只管 Node 版本
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm/action-setup 全权负责 pnpm 安装 + store 缓存。
      # 不传 version：以 package.json 的 packageManager 为唯一事实源
      # （此前这里写死 12.4.2，与清单的 12.5.1 漂移，属历史遗留）。
      # cache 为布尔（v4 语义）；写 `cache: 'pnpm'` 会让 action 在 Setup pnpm 步骤即抛错。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (minified)
        run: pnpm build

      - name: Package VSIX
        run: npx @vscode/vsce package
        # vsce 默认把 VSIX 放在仓库根目录，文件名 = publisher-name-version.vsix
        # 用 action 上传一次，方便回滚或手动验证

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      - name: Publish to Marketplace
        # 判的是 env（非 secrets）；未配置 VSCE_PAT 时这步自动跳过，不会报红。
        # 配好 PAT 后直接生效；vsce 默认识别 VSCE_PAT 环境变量，无需 -p 传参
        # （官方亦建议避免把密钥放到命令行，以免进入进程表/审计日志）。
        if: github.event_name == 'push' && env.VSCE_PAT != ''
        run: npx @vscode/vsce publish
