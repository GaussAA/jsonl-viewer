# .github/workflows/release.yml
# Marketplace 自动发布流水线。
#
# 触发方式：
#   1. git tag v1.3.0 && git push origin v1.3.0     → 自动发布
#   2. GitHub Actions 页面 → Run workflow → 手动触发 → 自动发布
#
# 前置条件（一次性配置）：
#   a. 创建 Azure DevOps PAT（https://dev.azure.com → User Settings → Personal Access Tokens）
#      需要 Marketplace → Manage 权限
#   b. 在 GitHub 仓库 Settings → Secrets and variables → Actions → New repository secret
#      名称 VSCE_PAT，值就是 PAT
#   c. 首次发布前本地跑一次 npx @vscode/vsce login 完成账户绑定（一次性）
#
# vsce 默认识别 VSCE_PAT 环境变量，不需要额外传参。
#
# pnpm 安装策略：与 ci.yml 统一，用 corepack 激活。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 用 Node 内置 corepack 激活 pnpm，避免与 pnpm/action-setup 冲突
      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (minified)
        run: pnpm build

      - name: Package VSIX
        run: npx @vscode/vsce package
        # vsce 默认把 VSIX 放在仓库根目录，文件名 = publisher-name-version.vsix
        # 用 action 上传一次，方便回滚或手动验证

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

      - name: Publish to Marketplace
        # VSCE_PAT 由 GitHub Secret 提供，vsce 自动读这个环境变量
        # 当前阶段（未发布）没有配置 VSCE_PAT 时这步自动跳过，不会报红。
        # 以后配好 PAT 后直接生效。
        if: github.event_name == 'push' && secrets.VSCE_PAT != ''
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
