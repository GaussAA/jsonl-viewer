<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>JSONL Viewer — Host Mock Harness</title>
<style>
  html, body, #app { height: 100%; margin: 0; }
  body { background: #1e1e1e; }
  /* === 滚动条（与 extension.ts HTML 模板内联样式保持一致） === */
  html, body { scrollbar-width: auto !important; scrollbar-color: rgba(255,255,255,0.06) transparent !important; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width: 4px !important; height: 4px !important; }
  html::-webkit-scrollbar-track, body::-webkit-scrollbar-track { background: transparent !important; }
  html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.06) !important;
    border-radius: 999px !important;
    transition: background .2s ease !important;
  }
  html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18) !important; }
  html::-webkit-scrollbar-thumb:active, body::-webkit-scrollbar-thumb:active { background: rgba(255,255,255,0.28) !important; }
  html::-webkit-scrollbar-corner, body::-webkit-scrollbar-corner { background: transparent !important; }
  /* 滚动容器也必须显式声明 + !important，覆盖 VS Code 可能的 * { scrollbar-width: thin !important } 注入 */
  .jlv-list-wrap, .jlv-tree-body { scrollbar-width: auto !important; scrollbar-color: rgba(255,255,255,0.06) transparent !important; }
  .jlv-list-wrap::-webkit-scrollbar, .jlv-tree-body::-webkit-scrollbar { width: 4px !important; height: 4px !important; }
  .jlv-list-wrap::-webkit-scrollbar-track, .jlv-tree-body::-webkit-scrollbar-track { background: transparent !important; }
  .jlv-list-wrap::-webkit-scrollbar-thumb, .jlv-tree-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.06) !important;
    border-radius: 999px !important;
  }
  .jlv-list-wrap:hover::-webkit-scrollbar-thumb, .jlv-tree-body:hover::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.16) !important;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
 * Host Mock Harness：在普通浏览器中运行真实的 dist/webview.js。
 * 模拟扩展宿主：acquireVsCodeApi + RPC 响应（init/readRecords/
 * readRecord/search/filter/getSampleFields/persistState/...）。
 *
 * 编辑能力（2026-09-22 补齐）：维护一份**可变的行文本表**，故「编辑」在 harness 里
 * 是真的会改数据的 —— 保存后刷新列表/详情能看到变化；乐观锁与 JSON 校验亦按真实宿主
 * 的语义实现（冲突/非法一律拒绝，且绝不写入）。
 *
 * 控制台可用（便于手动验证 webview 的各条推送路径）：
 *   mockRevert()  放弃改动并从「磁盘」重载 → 触发 documentReset
 *   mockStale()   模拟外部修改文件       → 触发 fileStale（顶部「重新加载」横幅）
 *
 * M2（增删行）：数据源是**真正的可变行数组**，故 insertRecord / deleteRecord 会实际
 * 改变行数与后续行号，右键「在第 N 行前插入」「删除第 N 行」都能验完整链路。
 *
 * M2（查找替换）：工具栏搜索框右侧的互换图标展开「替换为…」输入行，点「全部替换」会
 * 先弹顶部横幅二次确认（webview 里 window.confirm 不可用），确认后本 harness 按真实宿主
 * 语义逐行改写：字面量匹配、非重叠、替换后 JSON 非法即跳过该行并在结果文案中如实报出。
 *
 * M3（进度与取消）：确认后先推 4 拍进度（真实宿主按 4MB 分块节流上报），横幅显示百分比
 * 与「取消」按钮；中途点取消会真的中止且**不改动任何数据** —— 与真实宿主一致，
 * 批量重写在 rename 之前中止时目标文件从未被触碰。
 *
 * M3（编辑历史）：工具栏「历史」按钮打开浮层，列出本次会话的写操作（光标之前的为已应用、
 * 之后的为已撤销）；点条目「停在这一步」、顶部可单步撤销/重做。harness 用整份行数组的
 * 快照实现回退，但**单一光标语义与真实宿主一致**。
 *
 * M2（多选批量）：Ctrl/Cmd 点击切换选中、Shift 点击范围选择；选中 > 1 行时列表下方
 * 出现操作条（复制 / 删除 / 取消选择），右键菜单顶部也会出现批量项。批量删除会真的
 * 改变数组长度与后续行号；复制走浏览器剪贴板（localhost 下可用）。
 *
 * M3（坏行诊断）：工具栏状态行出现「⚠ N 坏行」徽章（无坏行时不显示）→ 点击打开浮层。
 * 未扫描时徽章写「N+」（下界，虚线边框）且提示「仅在已浏览范围内」；点「扫描整个文件」
 * 走 4 拍进度（可取消），完成后转为确数。「全选坏行」把坏行写入选区，随后可直接用
 * 选区操作条的「删除」一次清除 —— 这就是「找出坏行 → 一键清除」的完整清洗闭环。
 *
 * M3（字段级编辑）：选一条记录后，右侧详情树里**悬停**任一标量行会显出一个小铅笔图标
 * → 点它打开浮层改这一个字段的值。保存后只替换原文里那一段字节（键序与空白原样保留），
 * 再走整行编辑落盘。字符串/数字用输入框、布尔用两个按钮、null 与容器不给入口
 * （后者请用工具栏的整行编辑）。harness 的 readRecord 回传了 rawText，故这条路可直接验。
 * 勾选「同时更新其他行中此路径下值相同的字段」再保存 → 浮层先关闭、底部横幅二次确认
 * → 确认后走批量字段级替换（4 拍进度可取消）：只有该路径下**值相同**的字段被改，
 * 其他字段里恰好含相同文本的地方不受波及。
 *
 * 注：totalBytes 乘了 BYTES_SCALE（默认 2000），以便在小样例上也能验证「大 cost
 * 编辑」的提示；真实宿主的 totalBytes 是磁盘真实字节数。
 * ============================================================ */

/* ---------------- 模拟数据：500 行样例 JSONL ---------------- */
const TOTAL_LINES = 500;
const BAD_LINE = 37; // 每 37 行一条坏行（演示红标）

function sampleValue(line) {
  const i = line;
  const long = i % 19 === 0;
  return {
    id: i + 1,
    user: `user_${String(i + 1).padStart(4, '0')}${long ? '_very_long_username_that_overflows_the_container_width' : ''}`,
    status: ['active', 'inactive', 'pending', 'banned'][i % 4],
    category: `cat_${i % 10}`,
    amount: (i * 3.7) % 200 - 100,
    score: ((i * 13.3) % 100).toFixed(1),
    created: `2024-07-${String((i % 28) + 1).padStart(2, '0')}T16:56:00Z`,
    description: long
      ? 'A very long description value that should overflow and demonstrate text-overflow ellipsis behavior.'
      : 'short desc',
    meta: {
      topic: ['support', 'sales', 'ops', 'dev'][i % 4],
      attempts: i % 15,
      priority: ['low', 'medium', 'high', 'critical'][i % 4],
      tags: ['important', 'review', 'waiting', 'done'][i % 4],
      notes: long ? 'Long nested notes value for overflow testing in deeply nested object properties.' : '',
      metrics: {
        latency: { p50: 12 + (i % 9), p95: 34 + (i % 9), unit: 'ms' },
        errors: { count: i % 7, rate: 0.001, last: { code: 500, msg: 'timeout', ts: '2024-07-01T10:00:00Z' } },
      },
    },
    tags: ['vip', 'beta', 'stable', 'experimental'][i % 4],
  };
}

/* ---------------- 宿主实现 ---------------- */
const store = new Map(); // persistState 模拟（按 key）

/** 坏行的**原文**（非法 JSON）：用于演示红标，以及「把坏行改好」这一最常见的编辑动作。 */
const BAD_RAW = '{"broken": ';

/**
 * 可变行数组 —— 编辑 / 插入 / 删除都直接作用于它（惰性初始化）。
 * 用数组而非「下标 → 文本」的稀疏表，是因为增删会改变后续行号，稀疏表表达不了。
 */
let lines = null;

/** 演示用字节放大系数（见文件头说明）。 */
const BYTES_SCALE = 2000;
/** 已请求取消的 requestId（模拟宿主的 cancel 集合）。 */
const cancelledRequests = new Set();
/**
 * 是否已做过全文件坏行扫描（决定 getBadLines 回 partial 还是全量口径）。
 *
 * 与真实宿主一致：任何改动文件内容的操作都会让它失效（行号与内容都变了），
 * 故 recordHistory（写操作的统一收口）里会重置它。
 */
let badLinesComplete = false;

/** JSON 值深度相等（对象比较键集合与各键的值，键序无关；1 与 1.0 相等）。 */
function jsonEquals(a, b) {
  if (a === b) return true;
  if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return false;
  if (Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every((k) => k in b && jsonEquals(a[k], b[k]));
}

/** 当前行数组里的坏行（无法解析为 JSON 的行，含空行）。 */
function computeBadLines() {
  const out = [];
  const arr = ensureLines();
  for (let i = 0; i < arr.length; i++) {
    try {
      JSON.parse(arr[i]);
    } catch {
      out.push(i);
    }
  }
  return out;
}

function byteLen(s) {
  return new TextEncoder().encode(s).length;
}

/** 惰性初始化：坏行用非法 JSON 原文（演示红标与「把坏行改好」）。 */
function ensureLines() {
  if (lines) return lines;
  lines = [];
  for (let i = 0; i < TOTAL_LINES; i++) {
    lines.push((i + 1) % BAD_LINE === 0 ? BAD_RAW : JSON.stringify(sampleValue(i)));
  }
  return lines;
}

/* ---------------- 会话编辑历史（快照式简化实现，语义与真实宿主一致） ----------------
 * 真实宿主用一个「操作 + 双向回退数据」的光标模型；harness 无需那么精细，直接对整份
 * 行数组做快照即可 —— 关键是**单一光标语义与真实宿主一致**（历史浮层据此渲染）。 */
const hist = { states: [], labels: [], cursor: 0, dropped: false };

function resetHistory() {
  hist.states = [[...ensureLines()]];
  hist.labels = ['初始状态'];
  hist.cursor = 0;
  hist.dropped = false;
}

function ensureHistory() {
  if (hist.states.length === 0) resetHistory();
  return hist;
}

/** 记录一步（在写操作**之后**调用：快照即当前状态）。 */
function recordHistory(label) {
  // 文件内容已变 ⇒「全量扫过」这一结论不再有依据（与真实宿主的 refreshSnapshot 同义）。
  badLinesComplete = false;
  ensureHistory();
  // 在光标处发生新操作 → 其后的「已撤销」分支作废（标准撤销栈语义）
  hist.states.length = hist.cursor + 1;
  hist.labels.length = hist.cursor + 1;
  hist.states.push([...ensureLines()]);
  hist.labels.push(label);
  hist.cursor = hist.states.length - 1;
  while (hist.states.length > 51) {
    hist.states.shift();
    hist.labels.shift();
    hist.cursor--;
    hist.dropped = true;
  }
}

/** 用快照替换当前行集合（保持数组引用不变，避免其它闭包持有旧引用）。 */
function restoreLines(snapshot) {
  const arr = ensureLines();
  arr.length = 0;
  for (const l of snapshot) arr.push(l);
}

/** 把光标移到目标位置，返回实际步数。 */
function moveHistoryCursor(target) {
  const clamped = Math.max(0, Math.min(target, hist.states.length - 1));
  const steps = Math.abs(clamped - hist.cursor);
  hist.cursor = clamped;
  restoreLines(hist.states[hist.cursor]);
  return { clamped, steps };
}

/** 由描述反推类型（仅用于列表徽章）。 */
function histKindOf(label) {
  if (label.includes('插入')) return 'insert';
  if (label.startsWith('删除') && !label.includes('第')) return 'deleteMany';
  if (label.startsWith('删除')) return 'delete';
  if (label.startsWith('替换')) return 'replaceAll';
  return 'edit';
}

/** 取某行的**磁盘原文**。 */
function rawTextOf(line) {
  const arr = ensureLines();
  return Number.isInteger(line) && line >= 0 && line < arr.length ? arr[line] : '';
}

/** 当前总行数（随增删变化）。 */
function totalLinesNow() {
  return ensureLines().length;
}

/** 当前总字节数（含换行）。 */
function totalBytesNow() {
  let n = 0;
  for (const s of ensureLines()) n += byteLen(s) + 1;
  return n * BYTES_SCALE;
}

function recordFor(line) {
  const raw = rawTextOf(line);
  if (raw === '') return { line, ok: false, error: `行不存在：${line}` };
  try {
    return { line, ok: true, value: JSON.parse(raw) };
  } catch (e) {
    return { line, ok: false, error: `JSON 解析失败（行 ${line + 1}）：${e && e.message ? e.message : String(e)}` };
  }
}

/** 取某行某字段的值（解析失败返回 undefined）。 */
function parseFieldOf(line, field) {
  try {
    return JSON.parse(rawTextOf(line))[field];
  } catch {
    return undefined;
  }
}

async function handleHostRequest(msg) {
  const reply = (type, requestId, payload) => {
    window.postMessage({ type, requestId, payload }, '*');
  };
  /** 无 requestId 的主动推送（如 editProgress）。 */
  const push = (type, payload) => {
    window.postMessage({ type, payload }, '*');
  };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  switch (msg.type) {
    case 'ready':
      // init 主动推送
      window.postMessage({
        type: 'init',
        payload: { uri: 'mock://samples.jsonl', totalLines: totalLinesNow(), totalBytes: totalBytesNow(), buildMs: 48, eof: true },
      }, '*');
      return;
    case 'getOverview':
      reply('overview', msg.requestId, { uri: 'mock://samples.jsonl', totalLines: totalLinesNow(), totalBytes: totalBytesNow(), buildMs: 48, eof: true });
      return;
    case 'getSampleFields': {
      const fields = ['id', 'user', 'status', 'amount', 'category', 'score', 'created', 'description', 'meta', 'tags']
        .map((key) => {
          const v = sampleValue(0)[key];
          const t = Array.isArray(v) ? 'array' : v === null ? 'null' : typeof v === 'number' ? 'number' : 'string';
          return { key, type: t };
        });
      reply('sampleFields', msg.requestId, { fields, total: 100, scanned: 100 });
      return;
    }
    case 'readRecords': {
      const total = totalLinesNow();
      const items = [];
      for (let n = 0; n < msg.count; n++) {
        const line = msg.startLine + n;
        if (line >= 0 && line < total) items.push(recordFor(line));
      }
      reply('records', msg.requestId, {
        startLine: msg.startLine,
        items,
        hasMore: msg.startLine + msg.count < total,
      });
      return;
    }
    case 'readRecord': {
      const r = recordFor(msg.line);
      const rawText = rawTextOf(msg.line);
      // 编辑功能依赖 rawText（初始文本必须是磁盘原文）与 rawBytes（乐观锁断言）。
      reply('result', msg.requestId, {
        value: r.value,
        ok: r.ok,
        error: r.error,
        rawText,
        rawBytes: byteLen(rawText),
      });
      return;
    }
    case 'search': {
      const q = String(msg.query || '').toLowerCase();
      const total = totalLinesNow();
      const matches = [];
      for (let line = 0; line < total; line++) {
        if (line % 2 === 0) continue; // 模拟性能：仅奇数行参与匹配
        if (rawTextOf(line).toLowerCase().includes(q)) matches.push(line);
        if (matches.length >= 200) break;
      }
      reply('searchResults', msg.requestId, { matches, total: matches.length, truncated: false });
      return;
    }
    case 'filter': {
      const op = msg.op;
      const field = msg.field;
      const value = String(msg.value ?? '');
      const matches = [];
      const total = totalLinesNow();
      for (let line = 0; line < total; line++) {
        const v = parseFieldOf(line, field);
        let hit = false;
        if (op === 'eq') hit = String(v) === value;
        else if (op === 'contains') hit = String(v).toLowerCase().includes(value.toLowerCase());
        else if (op === 'exists') hit = v !== undefined && v !== null;
        else if (op === 'type') hit = Array.isArray(v) ? 'array' === value : (v === null ? 'null' : typeof v) === value;
        if (hit) matches.push(line);
        if (matches.length >= 200) break;
      }
      reply('filterResults', msg.requestId, { matches: matches.length ? matches : [], total: matches.length, truncated: false });
      return;
    }
    case 'getErrorLines': {
      const bad = [];
      const total = totalLinesNow();
      for (let line = 0; line < total; line++) {
        try {
          JSON.parse(rawTextOf(line));
        } catch {
          bad.push(line);
        }
      }
      reply('errorLines', msg.requestId, { lines: bad });
      return;
    }
    case 'jumpToSource':
      reply('result', msg.requestId, { jumped: true });
      return;
    case 'persistState':
      store.set(msg.key, msg.value);
      reply('result', msg.requestId, { ok: true });
      return;
    case 'loadState':
      reply('result', msg.requestId, store.get(msg.key));
      return;
    case 'editRecord': {
      const line = msg.line;
      const text = String(msg.text ?? '');
      const fail = (extra) =>
        reply('editResult', msg.requestId, {
          ok: false,
          line,
          bytesDelta: 0,
          inPlace: false,
          movedBytes: 0,
          costMs: 0,
          ...extra,
        });

      if (!Number.isInteger(line) || line < 0 || line >= TOTAL_LINES) {
        fail({ error: `无效行号：${line}` });
        return;
      }

      const before = rawTextOf(line);
      const beforeBytes = byteLen(before);

      // 乐观锁：磁盘上该行若已变化即拒绝（与真实宿主语义一致，绝不写入）。
      if (typeof msg.expectedBytes === 'number' && msg.expectedBytes !== beforeBytes) {
        fail({ conflict: true, error: '该行内容已变化（与编辑前视图不一致），请重新加载。' });
        return;
      }

      // JSON 校验：非法默认拒绝（真实宿主同样如此）。
      try {
        JSON.parse(text);
      } catch (e) {
        fail({ invalid: true, error: `JSON 校验未通过：${e && e.message ? e.message : String(e)}` });
        return;
      }

      // 模拟真实宿主的进度推送（写盘的搬移阶段）。前端只在「成本足够大」时才显示，
      // 此处照推 3 拍以便浏览器里能看见；中途点取消会真的中止且**不写入任何改动**
      // —— 与真实宿主一致（取消会自动回滚，文件保持原样）。
      const totalNow = totalBytesNow();
      const STEPS = 3;
      for (let i = 1; i <= STEPS; i++) {
        if (cancelledRequests.has(msg.requestId)) {
          cancelledRequests.delete(msg.requestId);
          fail({ cancelled: true, error: '已取消，文件已按备份恢复原样。' });
          return;
        }
        push('editProgress', {
          kind: 'edit',
          processedBytes: Math.floor((totalNow * i) / STEPS),
          totalBytes: totalNow,
        });
        await sleep(140);
      }

      ensureLines()[line] = text;
      recordHistory(`编辑第 ${line + 1} 行`);
      reply('editResult', msg.requestId, {
        ok: true,
        line,
        bytesDelta: (byteLen(text) - beforeBytes) * BYTES_SCALE,
        inPlace: byteLen(text) === beforeBytes,
        movedBytes: 0,
        costMs: 1,
        beforeText: before,
      });
      return;
    }
    case 'insertRecord': {
      const arr = ensureLines();
      const at = msg.at;
      const text = String(msg.text ?? '');
      const fail = (extra) =>
        reply('editResult', msg.requestId, {
          ok: false,
          line: at,
          bytesDelta: 0,
          inPlace: false,
          movedBytes: 0,
          costMs: 0,
          ...extra,
        });
      if (!Number.isInteger(at) || at < 0 || at > arr.length) {
        fail({ error: `无效插入位置：${at}` });
        return;
      }
      try {
        JSON.parse(text);
      } catch (e) {
        fail({ invalid: true, error: `JSON 校验未通过：${e && e.message ? e.message : String(e)}` });
        return;
      }
      arr.splice(at, 0, text);
      reply('editResult', msg.requestId, {
        ok: true,
        line: at,
        bytesDelta: (byteLen(text) + 1) * BYTES_SCALE,
        inPlace: false,
        movedBytes: 0,
        costMs: 1,
      });
      return;
    }
    case 'deleteRecord': {
      const arr = ensureLines();
      const line = msg.line;
      if (!Number.isInteger(line) || line < 0 || line >= arr.length) {
        reply('editResult', msg.requestId, {
          ok: false,
          line,
          bytesDelta: 0,
          inPlace: false,
          movedBytes: 0,
          costMs: 0,
          error: `无效行号：${line}`,
        });
        return;
      }
      const removed = arr.splice(line, 1)[0];
      recordHistory(`删除第 ${line + 1} 行`);
      reply('editResult', msg.requestId, {
        ok: true,
        line,
        bytesDelta: -(byteLen(removed) + 1) * BYTES_SCALE,
        inPlace: false,
        movedBytes: 0,
        costMs: 1,
        beforeText: removed,
      });
      return;
    }
    case 'replaceField': {
      // 演示简化：解析整行后沿路径取值/赋值再序列化重建。真实实现是 core/jsonSpan 的
      // 字节级外科替换（键序与空白逐字节保留）—— 正确性由单测保证，这里只演示交互流：
      // 勾选「应用到全部」→ 横幅二次确认 → 4 拍进度（可取消）→ 结果如实统计。
      const path = Array.isArray(msg.path) ? msg.path : [];
      const from = msg.from;
      const to = msg.to;
      const arr = ensureLines();
      const totalNow = totalBytesNow();
      let changed = 0, skippedInvalid = 0, unchanged = 0, delta = 0;
      const changes = [];
      for (let i = 0; i < arr.length; i++) {
        if (cancelledRequests.has(msg.requestId)) {
          cancelledRequests.delete(msg.requestId);
          reply('replaceFieldResult', msg.requestId, {
            ok: false, cancelled: true, replaced: 0, skippedInvalid: 0, unchanged: 0,
            total: arr.length, bytesDelta: 0, costMs: 0, undoable: false, error: '已取消',
          });
          return;
        }
        push('editProgress', {
          kind: 'replaceField',
          processedBytes: Math.floor((totalNow * i) / arr.length),
          totalBytes: totalNow,
        });
        await sleep(60); // 模拟扫描耗时：让进度可见、取消可点
        let obj;
        try { obj = JSON.parse(arr[i]); } catch { skippedInvalid++; continue; }
        let cur = obj;
        let okPath = true;
        for (const seg of path) {
          if (cur === null || typeof cur !== 'object') { okPath = false; break; }
          cur = cur[seg];
        }
        if (!okPath || cur === undefined) { unchanged++; continue; }
        if (!jsonEquals(cur, from)) { unchanged++; continue; }
        let target = obj;
        for (let d = 0; d < path.length - 1; d++) target = target[path[d]];
        target[path[path.length - 1]] = to;
        const before = arr[i];
        const after = JSON.stringify(obj);
        delta += byteLen(after) - byteLen(before);
        arr[i] = after;
        changes.push({ line: i, before, after });
        changed++;
      }
      push('editProgress', { kind: 'replaceField', processedBytes: totalNow, totalBytes: totalNow });
      if (changed === 0) {
        reply('replaceFieldResult', msg.requestId, {
          ok: true, replaced: 0, skippedInvalid, unchanged, total: arr.length, bytesDelta: 0, costMs: 0, undoable: false,
        });
        return;
      }
      recordHistory('批量字段替换');
      const undoable = changed <= 2000;
      reply('replaceFieldResult', msg.requestId, {
        ok: true,
        replaced: changed,
        skippedInvalid,
        unchanged,
        total: arr.length,
        bytesDelta: delta * BYTES_SCALE,
        costMs: 2,
        changes: undoable ? changes : undefined,
        undoable,
      });
      return;
    }
    case 'replaceText': {
      // 与真实宿主语义一致：字面量匹配（绝不当正则）、非重叠、逐行 JSON 校验后跳过非法行。
      const query = String(msg.query ?? '');
      const replacement = String(msg.replacement ?? '');
      const ci = msg.caseInsensitive !== false;
      const lines = ensureLines();

      const fail = (error) =>
        reply('replaceResult', msg.requestId, {
          ok: false,
          replaced: 0,
          skippedInvalid: 0,
          unchanged: 0,
          total: 0,
          bytesDelta: 0,
          costMs: 0,
          undoable: false,
          error,
        });
      if (!query) {
        fail('查找内容不能为空');
        return;
      }

      // 只折 ASCII A-Z 且长度严格不变 —— 否则用折叠串算出的索引去原串切片会错位。
      const fold = (s) => s.replace(/[A-Z]/g, (c) => c.toLowerCase());
      const needle = ci ? fold(query) : query;

      const changes = [];
      let skippedInvalid = 0;
      let unchanged = 0;
      for (let line = 0; line < lines.length; line++) {
        const raw = lines[line];
        const hay = ci ? fold(raw) : raw;
        if (!hay.includes(needle)) continue;

        let from = 0;
        let out = '';
        let count = 0;
        let at;
        while ((at = hay.indexOf(needle, from)) >= 0) {
          out += raw.slice(from, at) + replacement; // 用原串切片，保留未命中处的大小写
          from = at + needle.length;
          count++;
        }
        if (count === 0) continue;
        out += raw.slice(from);

        if (out === raw) {
          unchanged++;
          continue;
        }
        try {
          JSON.parse(out);
        } catch {
          skippedInvalid++;
          continue;
        }
        changes.push({ line, before: raw, after: out });
      }

      const total = changes.length + skippedInvalid + unchanged;
      if (changes.length === 0) {
        reply('replaceResult', msg.requestId, {
          ok: true,
          replaced: 0,
          skippedInvalid,
          unchanged,
          total,
          bytesDelta: 0,
          costMs: 0,
          undoable: false,
        });
        return;
      }

      // 模拟真实宿主的进度推送（真实版按 4MB 分块节流上报），分 4 拍演示，
      // 顺带让「取消」按钮在浏览器里可验证：中途点取消会真的中止且不改数据。
      const totalNow = totalBytesNow();
      const STEPS = 4;
      for (let i = 1; i <= STEPS; i++) {
        if (cancelledRequests.has(msg.requestId)) {
          cancelledRequests.delete(msg.requestId);
          reply('replaceResult', msg.requestId, {
            ok: false,
            cancelled: true,
            replaced: 0,
            skippedInvalid: 0,
            unchanged: 0,
            total: 0,
            bytesDelta: 0,
            costMs: 0,
            undoable: false,
            error: '已取消',
          });
          return;
        }
        push('editProgress', {
          kind: 'replace',
          processedBytes: Math.floor((totalNow * i) / STEPS),
          totalBytes: totalNow,
        });
        await sleep(140);
      }

      let delta = 0;
      for (const c of changes) {
        delta += byteLen(c.after) - byteLen(c.before);
        lines[c.line] = c.after;
      }
      recordHistory(`替换 ${changes.length} 行`);
      const undoable = changes.length <= 2000;
      reply('replaceResult', msg.requestId, {
        ok: true,
        replaced: changes.length,
        skippedInvalid,
        unchanged,
        total,
        bytesDelta: delta * BYTES_SCALE,
        costMs: 2,
        changes: undoable ? changes : undefined,
        undoable,
      });
      return;
    }
    case 'getBadLines': {
      // 未扫描时回空集 + partial（真实宿主是「已浏览范围内发现的」，此处简化为空）——
      // 这个简化只会让演示更保守，不会假装知道得比实际多。
      const bad = badLinesComplete ? computeBadLines() : [];
      reply('badLines', msg.requestId, {
        lines: bad,
        partial: !badLinesComplete,
        scanned: badLinesComplete ? totalLinesNow() : 0,
        totalLines: totalLinesNow(),
        truncated: false,
        costMs: 0,
      });
      return;
    }
    case 'scanBadLines': {
      // 按真实宿主语义：纯读、分拍上报进度、可取消且**取消不改变任何状态**。
      const totalNow = totalBytesNow();
      const STEPS = 4;
      for (let i = 1; i <= STEPS; i++) {
        if (cancelledRequests.has(msg.requestId)) {
          cancelledRequests.delete(msg.requestId);
          reply('badLines', msg.requestId, {
            lines: [],
            partial: true,
            scanned: 0,
            totalLines: totalLinesNow(),
            truncated: false,
            cancelled: true,
            costMs: 0,
          });
          return;
        }
        push('editProgress', {
          kind: 'scanBadLines',
          processedBytes: Math.floor((totalNow * i) / STEPS),
          totalBytes: totalNow,
        });
        await sleep(140);
      }
      badLinesComplete = true;
      const bad = computeBadLines();
      reply('badLines', msg.requestId, {
        lines: bad,
        partial: false,
        scanned: totalLinesNow(),
        totalLines: totalLinesNow(),
        truncated: false,
        costMs: 580,
      });
      return;
    }
    case 'deleteRecords': {
      // 与真实宿主语义一致：行号去重 + 越界过滤 + 相邻行合并成连续区间。
      const arr = ensureLines();
      const wanted = [...new Set(Array.isArray(msg.lines) ? msg.lines : [])]
        .filter((l) => Number.isInteger(l) && l >= 0 && l < arr.length)
        .sort((a, b) => a - b);
      if (wanted.length === 0) {
        reply('deleteManyResult', msg.requestId, {
          ok: false,
          deleted: 0,
          ranges: 0,
          bytesDelta: 0,
          costMs: 0,
          skipped: 0,
          error: '没有可删除的行',
        });
        return;
      }
      let ranges = 1;
      for (let i = 1; i < wanted.length; i++) {
        if (wanted[i] !== wanted[i - 1] + 1) ranges++;
      }
      let removedBytes = 0;
      // 倒序删除：行号才不会因前面的删除而位移
      for (let i = wanted.length - 1; i >= 0; i--) {
        removedBytes += byteLen(arr[wanted[i]]) + 1;
        arr.splice(wanted[i], 1);
      }
      recordHistory(`删除 ${wanted.length} 行`);
      reply('deleteManyResult', msg.requestId, {
        ok: true,
        deleted: wanted.length,
        ranges,
        bytesDelta: -removedBytes * BYTES_SCALE,
        costMs: 1,
        skipped: 0,
      });
      return;
    }
    case 'copyLines': {
      const arr = ensureLines();
      const wanted = [...new Set(Array.isArray(msg.lines) ? msg.lines : [])]
        .filter((l) => Number.isInteger(l) && l >= 0 && l < arr.length)
        .sort((a, b) => a - b);
      const text = wanted.map((l) => arr[l] + '\n').join('');
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        reply('copyResult', msg.requestId, {
          ok: false,
          count: 0,
          bytes: 0,
          truncated: false,
          skipped: 0,
          error: '写入剪贴板失败（浏览器可能未授权）：' + (e && e.message ? e.message : String(e)),
        });
        return;
      }
      reply('copyResult', msg.requestId, {
        ok: true,
        count: wanted.length,
        bytes: text.length,
        truncated: false,
        skipped: 0,
      });
      return;
    }
    case 'getHistory': {
      ensureHistory();
      reply('history', msg.requestId, {
        entries: hist.labels.slice(1).map((label, i) => ({
          id: 'h' + (i + 1),
          kind: histKindOf(label),
          label,
          lines: 1,
          bytesDelta: 0,
          at: Date.now(),
        })),
        cursor: Math.max(0, hist.cursor - 1),
        dropped: hist.dropped,
      });
      return;
    }
    case 'undoEdit':
    case 'redoEdit':
    case 'revertTo': {
      ensureHistory();
      // 三者的目标都以「条目下标 + 1」为光标（与真实宿主一致：停在这一步）
      let target;
      if (msg.type === 'undoEdit') target = hist.cursor - 1;
      else if (msg.type === 'redoEdit') target = hist.cursor + 1;
      else {
        const n = Number(String(msg.id ?? '').replace(/^h/, ''));
        target = Number.isFinite(n) ? n + 1 : hist.cursor;
      }
      const totalOps = hist.states.length - 1;
      const clamped = Math.max(0, Math.min(target, hist.states.length - 1));
      if (clamped === hist.cursor) {
        reply('historyResult', msg.requestId, {
          ok: false,
          steps: 0,
          cursor: Math.max(0, hist.cursor - 1),
          total: totalOps,
          error: target < hist.cursor ? '没有可撤销的操作' : '没有可重做的操作',
        });
        return;
      }
      const { steps } = moveHistoryCursor(clamped);
      reply('historyResult', msg.requestId, {
        ok: true,
        steps,
        cursor: Math.max(0, hist.cursor - 1),
        total: totalOps,
        label: hist.labels[hist.cursor] ?? '',
      });
      return;
    }
    case 'fileReload':
      hist.states = []; // 行号已失效：下次访问时按新内容重建历史
      badLinesComplete = false;
      reply('overview', msg.requestId, { uri: 'mock://samples.jsonl', totalLines: totalLinesNow(), totalBytes: totalBytesNow(), buildMs: 12, eof: true });
      return;
    case 'cancel':
      cancelledRequests.add(msg.requestId);
      return;
    default:
      reply('error', msg.requestId, `endpoint not implemented: ${msg.type}`);
  }
}

/* ---------------- 控制台钩子（手动验证各条推送路径） ---------------- */

/** 放弃所有改动并从「磁盘」重载 → 触发 documentReset。 */
window.mockRevert = () => {
  hist.states = [];
  badLinesComplete = false;
  lines = null; // 丢弃所有改动，下次访问时按样例重新生成
  window.postMessage(
    { type: 'documentReset', payload: { message: '已从磁盘重新加载（harness 模拟）。' } },
    '*'
  );
};

/** 模拟外部程序修改了文件 → 触发 fileStale（应出现「重新加载」横幅）。 */
window.mockStale = () => {
  window.postMessage(
    { type: 'fileStale', payload: { message: '文件已被外部修改（harness 模拟）。', deleted: false } },
    '*'
  );
};

/* ---------------- mock acquireVsCodeApi ---------------- */
window.acquireVsCodeApi = () => ({
  postMessage: (msg) => {
    // handler 已改为 async：异常必须显式兜住，否则会静默变成 unhandled rejection，
    // 在浏览器控制台里表现为「点了没反应」。
    Promise.resolve(handleHostRequest(msg)).catch((e) => {
      console.error('[harness] handler 异常：', e);
      window.postMessage(
        { type: 'error', requestId: msg && msg.requestId, message: String(e) },
        '*'
      );
    });
  },
  getState: () => null,
  setState: () => {},
});

/* 窗口内 RPC：webview 监听 message 事件，宿主响应也走同一通道 */
window.addEventListener('message', (e) => {
  // webview 发来的请求已由 acquireVsCodeApi.postMessage 处理；这里仅确保消息不重复处理
  void e;
});
</script>
