<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>JSONL Viewer — Host Mock Harness</title>
<style>
  html, body, #app { height: 100%; margin: 0; }
  body { background: #1e1e1e; }
  /* === 滚动条（与 extension.ts HTML 模板内联样式保持一致） === */
  html, body { scrollbar-width: auto !important; scrollbar-color: rgba(255,255,255,0.06) transparent !important; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width: 4px !important; height: 4px !important; }
  html::-webkit-scrollbar-track, body::-webkit-scrollbar-track { background: transparent !important; }
  html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.06) !important;
    border-radius: 999px !important;
    transition: background .2s ease !important;
  }
  html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18) !important; }
  html::-webkit-scrollbar-thumb:active, body::-webkit-scrollbar-thumb:active { background: rgba(255,255,255,0.28) !important; }
  html::-webkit-scrollbar-corner, body::-webkit-scrollbar-corner { background: transparent !important; }
  /* 滚动容器也必须显式声明 + !important，覆盖 VS Code 可能的 * { scrollbar-width: thin !important } 注入 */
  .jlv-list-wrap, .jlv-tree-body { scrollbar-width: auto !important; scrollbar-color: rgba(255,255,255,0.06) transparent !important; }
  .jlv-list-wrap::-webkit-scrollbar, .jlv-tree-body::-webkit-scrollbar { width: 4px !important; height: 4px !important; }
  .jlv-list-wrap::-webkit-scrollbar-track, .jlv-tree-body::-webkit-scrollbar-track { background: transparent !important; }
  .jlv-list-wrap::-webkit-scrollbar-thumb, .jlv-tree-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.06) !important;
    border-radius: 999px !important;
  }
  .jlv-list-wrap:hover::-webkit-scrollbar-thumb, .jlv-tree-body:hover::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.16) !important;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
 * Host Mock Harness：在普通浏览器中运行真实的 dist/webview.js。
 * 模拟扩展宿主：acquireVsCodeApi + RPC 响应（init/readRecords/
 * readRecord/search/filter/getSampleFields/persistState/...）。
 *
 * 编辑能力（2026-09-22 补齐）：维护一份**可变的行文本表**，故「编辑」在 harness 里
 * 是真的会改数据的 —— 保存后刷新列表/详情能看到变化；乐观锁与 JSON 校验亦按真实宿主
 * 的语义实现（冲突/非法一律拒绝，且绝不写入）。
 *
 * 控制台可用（便于手动验证 webview 的各条推送路径）：
 *   mockRevert()  放弃改动并从「磁盘」重载 → 触发 documentReset
 *   mockStale()   模拟外部修改文件       → 触发 fileStale（顶部「重新加载」横幅）
 *
 * M2（增删行）：数据源是**真正的可变行数组**，故 insertRecord / deleteRecord 会实际
 * 改变行数与后续行号，右键「在第 N 行前插入」「删除第 N 行」都能验完整链路。
 *
 * 注：totalBytes 乘了 BYTES_SCALE（默认 2000），以便在小样例上也能验证「大 cost
 * 编辑」的提示；真实宿主的 totalBytes 是磁盘真实字节数。
 * ============================================================ */

/* ---------------- 模拟数据：500 行样例 JSONL ---------------- */
const TOTAL_LINES = 500;
const BAD_LINE = 37; // 每 37 行一条坏行（演示红标）

function sampleValue(line) {
  const i = line;
  const long = i % 19 === 0;
  return {
    id: i + 1,
    user: `user_${String(i + 1).padStart(4, '0')}${long ? '_very_long_username_that_overflows_the_container_width' : ''}`,
    status: ['active', 'inactive', 'pending', 'banned'][i % 4],
    category: `cat_${i % 10}`,
    amount: (i * 3.7) % 200 - 100,
    score: ((i * 13.3) % 100).toFixed(1),
    created: `2024-07-${String((i % 28) + 1).padStart(2, '0')}T16:56:00Z`,
    description: long
      ? 'A very long description value that should overflow and demonstrate text-overflow ellipsis behavior.'
      : 'short desc',
    meta: {
      topic: ['support', 'sales', 'ops', 'dev'][i % 4],
      attempts: i % 15,
      priority: ['low', 'medium', 'high', 'critical'][i % 4],
      tags: ['important', 'review', 'waiting', 'done'][i % 4],
      notes: long ? 'Long nested notes value for overflow testing in deeply nested object properties.' : '',
      metrics: {
        latency: { p50: 12 + (i % 9), p95: 34 + (i % 9), unit: 'ms' },
        errors: { count: i % 7, rate: 0.001, last: { code: 500, msg: 'timeout', ts: '2024-07-01T10:00:00Z' } },
      },
    },
    tags: ['vip', 'beta', 'stable', 'experimental'][i % 4],
  };
}

/* ---------------- 宿主实现 ---------------- */
const store = new Map(); // persistState 模拟（按 key）

/** 坏行的**原文**（非法 JSON）：用于演示红标，以及「把坏行改好」这一最常见的编辑动作。 */
const BAD_RAW = '{"broken": ';

/**
 * 可变行数组 —— 编辑 / 插入 / 删除都直接作用于它（惰性初始化）。
 * 用数组而非「下标 → 文本」的稀疏表，是因为增删会改变后续行号，稀疏表表达不了。
 */
let lines = null;

/** 演示用字节放大系数（见文件头说明）。 */
const BYTES_SCALE = 2000;

function byteLen(s) {
  return new TextEncoder().encode(s).length;
}

/** 惰性初始化：坏行用非法 JSON 原文（演示红标与「把坏行改好」）。 */
function ensureLines() {
  if (lines) return lines;
  lines = [];
  for (let i = 0; i < TOTAL_LINES; i++) {
    lines.push((i + 1) % BAD_LINE === 0 ? BAD_RAW : JSON.stringify(sampleValue(i)));
  }
  return lines;
}

/** 取某行的**磁盘原文**。 */
function rawTextOf(line) {
  const arr = ensureLines();
  return Number.isInteger(line) && line >= 0 && line < arr.length ? arr[line] : '';
}

/** 当前总行数（随增删变化）。 */
function totalLinesNow() {
  return ensureLines().length;
}

/** 当前总字节数（含换行）。 */
function totalBytesNow() {
  let n = 0;
  for (const s of ensureLines()) n += byteLen(s) + 1;
  return n * BYTES_SCALE;
}

function recordFor(line) {
  const raw = rawTextOf(line);
  if (raw === '') return { line, ok: false, error: `行不存在：${line}` };
  try {
    return { line, ok: true, value: JSON.parse(raw) };
  } catch (e) {
    return { line, ok: false, error: `JSON 解析失败（行 ${line + 1}）：${e && e.message ? e.message : String(e)}` };
  }
}

/** 取某行某字段的值（解析失败返回 undefined）。 */
function parseFieldOf(line, field) {
  try {
    return JSON.parse(rawTextOf(line))[field];
  } catch {
    return undefined;
  }
}

function handleHostRequest(msg) {
  const reply = (type, requestId, payload) => {
    window.postMessage({ type, requestId, payload }, '*');
  };
  switch (msg.type) {
    case 'ready':
      // init 主动推送
      window.postMessage({
        type: 'init',
        payload: { uri: 'mock://samples.jsonl', totalLines: totalLinesNow(), totalBytes: totalBytesNow(), buildMs: 48, eof: true },
      }, '*');
      return;
    case 'getOverview':
      reply('overview', msg.requestId, { uri: 'mock://samples.jsonl', totalLines: totalLinesNow(), totalBytes: totalBytesNow(), buildMs: 48, eof: true });
      return;
    case 'getSampleFields': {
      const fields = ['id', 'user', 'status', 'amount', 'category', 'score', 'created', 'description', 'meta', 'tags']
        .map((key) => {
          const v = sampleValue(0)[key];
          const t = Array.isArray(v) ? 'array' : v === null ? 'null' : typeof v === 'number' ? 'number' : 'string';
          return { key, type: t };
        });
      reply('sampleFields', msg.requestId, { fields, total: 100, scanned: 100 });
      return;
    }
    case 'readRecords': {
      const total = totalLinesNow();
      const items = [];
      for (let n = 0; n < msg.count; n++) {
        const line = msg.startLine + n;
        if (line >= 0 && line < total) items.push(recordFor(line));
      }
      reply('records', msg.requestId, {
        startLine: msg.startLine,
        items,
        hasMore: msg.startLine + msg.count < total,
      });
      return;
    }
    case 'readRecord': {
      const r = recordFor(msg.line);
      const rawText = rawTextOf(msg.line);
      // 编辑功能依赖 rawText（初始文本必须是磁盘原文）与 rawBytes（乐观锁断言）。
      reply('result', msg.requestId, {
        value: r.value,
        ok: r.ok,
        error: r.error,
        rawText,
        rawBytes: byteLen(rawText),
      });
      return;
    }
    case 'search': {
      const q = String(msg.query || '').toLowerCase();
      const total = totalLinesNow();
      const matches = [];
      for (let line = 0; line < total; line++) {
        if (line % 2 === 0) continue; // 模拟性能：仅奇数行参与匹配
        if (rawTextOf(line).toLowerCase().includes(q)) matches.push(line);
        if (matches.length >= 200) break;
      }
      reply('searchResults', msg.requestId, { matches, total: matches.length, truncated: false });
      return;
    }
    case 'filter': {
      const op = msg.op;
      const field = msg.field;
      const value = String(msg.value ?? '');
      const matches = [];
      const total = totalLinesNow();
      for (let line = 0; line < total; line++) {
        const v = parseFieldOf(line, field);
        let hit = false;
        if (op === 'eq') hit = String(v) === value;
        else if (op === 'contains') hit = String(v).toLowerCase().includes(value.toLowerCase());
        else if (op === 'exists') hit = v !== undefined && v !== null;
        else if (op === 'type') hit = Array.isArray(v) ? 'array' === value : (v === null ? 'null' : typeof v) === value;
        if (hit) matches.push(line);
        if (matches.length >= 200) break;
      }
      reply('filterResults', msg.requestId, { matches: matches.length ? matches : [], total: matches.length, truncated: false });
      return;
    }
    case 'getErrorLines': {
      const bad = [];
      const total = totalLinesNow();
      for (let line = 0; line < total; line++) {
        try {
          JSON.parse(rawTextOf(line));
        } catch {
          bad.push(line);
        }
      }
      reply('errorLines', msg.requestId, { lines: bad });
      return;
    }
    case 'jumpToSource':
      reply('result', msg.requestId, { jumped: true });
      return;
    case 'persistState':
      store.set(msg.key, msg.value);
      reply('result', msg.requestId, { ok: true });
      return;
    case 'loadState':
      reply('result', msg.requestId, store.get(msg.key));
      return;
    case 'editRecord': {
      const line = msg.line;
      const text = String(msg.text ?? '');
      const fail = (extra) =>
        reply('editResult', msg.requestId, {
          ok: false,
          line,
          bytesDelta: 0,
          inPlace: false,
          movedBytes: 0,
          costMs: 0,
          ...extra,
        });

      if (!Number.isInteger(line) || line < 0 || line >= TOTAL_LINES) {
        fail({ error: `无效行号：${line}` });
        return;
      }

      const before = rawTextOf(line);
      const beforeBytes = byteLen(before);

      // 乐观锁：磁盘上该行若已变化即拒绝（与真实宿主语义一致，绝不写入）。
      if (typeof msg.expectedBytes === 'number' && msg.expectedBytes !== beforeBytes) {
        fail({ conflict: true, error: '该行内容已变化（与编辑前视图不一致），请重新加载。' });
        return;
      }

      // JSON 校验：非法默认拒绝（真实宿主同样如此）。
      try {
        JSON.parse(text);
      } catch (e) {
        fail({ invalid: true, error: `JSON 校验未通过：${e && e.message ? e.message : String(e)}` });
        return;
      }

      ensureLines()[line] = text;
      reply('editResult', msg.requestId, {
        ok: true,
        line,
        bytesDelta: (byteLen(text) - beforeBytes) * BYTES_SCALE,
        inPlace: byteLen(text) === beforeBytes,
        movedBytes: 0,
        costMs: 1,
        beforeText: before,
      });
      return;
    }
    case 'insertRecord': {
      const arr = ensureLines();
      const at = msg.at;
      const text = String(msg.text ?? '');
      const fail = (extra) =>
        reply('editResult', msg.requestId, {
          ok: false,
          line: at,
          bytesDelta: 0,
          inPlace: false,
          movedBytes: 0,
          costMs: 0,
          ...extra,
        });
      if (!Number.isInteger(at) || at < 0 || at > arr.length) {
        fail({ error: `无效插入位置：${at}` });
        return;
      }
      try {
        JSON.parse(text);
      } catch (e) {
        fail({ invalid: true, error: `JSON 校验未通过：${e && e.message ? e.message : String(e)}` });
        return;
      }
      arr.splice(at, 0, text);
      reply('editResult', msg.requestId, {
        ok: true,
        line: at,
        bytesDelta: (byteLen(text) + 1) * BYTES_SCALE,
        inPlace: false,
        movedBytes: 0,
        costMs: 1,
      });
      return;
    }
    case 'deleteRecord': {
      const arr = ensureLines();
      const line = msg.line;
      if (!Number.isInteger(line) || line < 0 || line >= arr.length) {
        reply('editResult', msg.requestId, {
          ok: false,
          line,
          bytesDelta: 0,
          inPlace: false,
          movedBytes: 0,
          costMs: 0,
          error: `无效行号：${line}`,
        });
        return;
      }
      const removed = arr.splice(line, 1)[0];
      reply('editResult', msg.requestId, {
        ok: true,
        line,
        bytesDelta: -(byteLen(removed) + 1) * BYTES_SCALE,
        inPlace: false,
        movedBytes: 0,
        costMs: 1,
        beforeText: removed,
      });
      return;
    }
    case 'fileReload':
      reply('overview', msg.requestId, { uri: 'mock://samples.jsonl', totalLines: totalLinesNow(), totalBytes: totalBytesNow(), buildMs: 12, eof: true });
      return;
    case 'cancel':
      return;
    default:
      reply('error', msg.requestId, `endpoint not implemented: ${msg.type}`);
  }
}

/* ---------------- 控制台钩子（手动验证各条推送路径） ---------------- */

/** 放弃所有改动并从「磁盘」重载 → 触发 documentReset。 */
window.mockRevert = () => {
  lines = null; // 丢弃所有改动，下次访问时按样例重新生成
  window.postMessage(
    { type: 'documentReset', payload: { message: '已从磁盘重新加载（harness 模拟）。' } },
    '*'
  );
};

/** 模拟外部程序修改了文件 → 触发 fileStale（应出现「重新加载」横幅）。 */
window.mockStale = () => {
  window.postMessage(
    { type: 'fileStale', payload: { message: '文件已被外部修改（harness 模拟）。', deleted: false } },
    '*'
  );
};

/* ---------------- mock acquireVsCodeApi ---------------- */
window.acquireVsCodeApi = () => ({
  postMessage: (msg) => handleHostRequest(msg),
  getState: () => null,
  setState: () => {},
});

/* 窗口内 RPC：webview 监听 message 事件，宿主响应也走同一通道 */
window.addEventListener('message', (e) => {
  // webview 发来的请求已由 acquireVsCodeApi.postMessage 处理；这里仅确保消息不重复处理
  void e;
});
</script>
<script src="/dist/webview.js"></script>
</body>
</html>
