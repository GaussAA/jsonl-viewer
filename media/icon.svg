<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 背景渐变：深蓝 → 深紫，科技感 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <!-- 卡片渐变 -->
    <linearGradient id="cardFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3f5c"/>
      <stop offset="100%" stop-color="#2a2f4a"/>
    </linearGradient>
    <linearGradient id="cardMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4f6c"/>
      <stop offset="100%" stop-color="#3a3f5a"/>
    </linearGradient>
    <!-- 高光渐变 -->
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007fd4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#88c0ff" stop-opacity="0.2"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="shadowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ========== 底板 ========== -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bg)"/>

  <!-- 细边框高光 -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ========== 三张层叠卡片（代表 JSON Lines 的多行） ========== -->

  <!-- 卡片 3：最后面（最高、最偏上左） -->
  <rect x="22" y="30" width="72" height="18" rx="5" ry="5" fill="url(#cardMid)" filter="url(#shadowSoft)" opacity="0.7"/>
  <!-- 卡片 3 上的简化 JSON 提示 -->
  <rect x="28" y="35" width="36" height="2.5" rx="1.2" fill="#e5c07b" opacity="0.5"/>
  <rect x="28" y="39" width="22" height="2.5" rx="1.2" fill="#7fdb8a" opacity="0.5"/>

  <!-- 卡片 2：中间 -->
  <rect x="26" y="48" width="72" height="18" rx="5" ry="5" fill="url(#cardMid)" filter="url(#shadowSoft)" opacity="0.85"/>
  <rect x="32" y="53" width="42" height="2.5" rx="1.2" fill="#e5c07b" opacity="0.6"/>
  <rect x="32" y="57" width="28" height="2.5" rx="1.2" fill="#88c0ff" opacity="0.6"/>

  <!-- ========== 卡片 1：前景最大（主卡片，带完整 JSON 元素） ========== -->
  <rect x="20" y="62" width="88" height="44" rx="8" ry="8" fill="url(#cardFront)" filter="url(#shadow)"/>

  <!-- 卡片 1 边框高光 -->
  <rect x="20" y="62" width="88" height="44" rx="8" ry="8" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- 卡片 1 内部 JSON 元素 -->
  <!-- 行 1: { "name": "Alice" -->
  <text x="28" y="78" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#abb2bf">{</text>
  <text x="38" y="78" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#e5c07b">"name"</text>
  <text x="72" y="78" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#abb2bf">:</text>
  <text x="78" y="78" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#7fdb8a">"Alice"</text>
  <text x="102" y="78" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#abb2bf">,</text>

  <!-- 行 2: "age": 30 -->
  <text x="28" y="92" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#e5c07b">"age"</text>
  <text x="58" y="92" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#abb2bf">:</text>
  <text x="64" y="92" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#88c0ff">30</text>
  <text x="78" y="92" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#abb2bf">,</text>

  <!-- 行 3: "active": true } -->
  <text x="28" y="106" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#e5c07b">"active"</text>
  <text x="72" y="106" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#abb2bf">:</text>
  <text x="78" y="106" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#c586c0">true</text>
  <text x="96" y="106" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="10" font-weight="600" fill="#abb2bf">}</text>

  <!-- ========== 顶部装饰：行号指示器 (L1, L2, L3) ========== -->
  <circle cx="24" cy="39" r="3.5" fill="#007fd4" opacity="0.6"/>
  <text x="24" y="42.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="5" font-weight="700" fill="#fff" opacity="0.9">1</text>

  <circle cx="26" cy="57" r="3.5" fill="#007fd4" opacity="0.75"/>
  <text x="26" y="60.5" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="5" font-weight="700" fill="#fff" opacity="0.9">2</text>

  <!-- ========== 右下角：选中/查看指示三角 ========== -->
  <polygon points="96,98 108,106 96,114" fill="url(#glow)" opacity="0.9"/>

  <!-- ========== 顶部左侧：简洁的花括号标识 ========== -->
  <g transform="translate(14,14)">
    <path d="M0 4 Q0 0 4 0 M4 0 L8 0 M8 0 Q12 0 12 4 M12 4 Q12 8 8 8 M8 8 L4 8 M4 8 Q0 8 0 4" 
          fill="none" stroke="#88c0ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>
